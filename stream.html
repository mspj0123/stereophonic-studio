<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>先読みストリーミング再生（試験）｜立体音響スタジオ</title>
<!-- クロスオリジン分離を静的ホスト(GitHub Pages)で有効化（SharedArrayBuffer用・MIT） -->
<script src="coi-serviceworker.js"></script>
</head>
<body>
<div class="wrap">

  <h1>先読みストリーミング再生 <span class="pill">試験ページ</span></h1>
  <p class="sub">
    手元のファイルを、分離が終わるのを待たずに
    <strong>追いついた分から立体音響で再生</strong>します。
    このページは既存のプレイヤーとは独立していて、互いに影響しません。
    <br>PCで鳴っている音やマイクから取り込みたい場合は <a href="capture.html">こちら</a>。
  </p>

  <div class="card">
    <h2>曲を選ぶ</h2>
    <div class="row"><input type="file" id="file" accept="audio/*"></div>
    <div id="engine-controls"></div>
  </div>

  <div id="engine-ui"></div>

</div>

<script type="module">
/* 手元のファイルを入口にする薄い層。
   分離・先読み再生・立体音響は engine.js（capture.html と共通）が持つ。 */
import { initEngine, setReady } from './engine.js';

const SAMPLE_RATE = 44100;
const $ = (id) => document.getElementById(id);

// デコードは音源ごとに要る。ファイルを選んだ時点で始めておく。
let picked = null, decoded = null;

function startDecode() {
  const file = $('file').files[0];
  if (!file || file === picked) return;
  picked = file;
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
  decoded = file.arrayBuffer()
    .then(b => ctx.decodeAudioData(b))
    .then(d => { ctx.close(); return d; })
    .catch(e => { ctx.close(); throw e; });
  decoded.catch(() => {});   // ここでは握るだけ。失敗は開始時に知らせる
}

$('file').addEventListener('change', () => {
  setReady(!!$('file').files[0]);
  startDecode();
});

initEngine({
  startLabel: '分離して再生する',
  canStart: () => !!$('file').files[0],
  getAudio: async () => {
    const file = $('file').files[0];
    if (!file) throw new Error('ファイルが選ばれていません');
    if (!decoded || picked !== file) startDecode();
    const d = await decoded;
    return {
      left:  d.getChannelData(0),
      right: d.numberOfChannels > 1 ? d.getChannelData(1) : d.getChannelData(0),
      sampleRate: d.sampleRate,
      duration: d.duration,
      label: `ファイル: ${file.name}（${(file.size / 1024 / 1024).toFixed(1)}MB）`,
    };
  },
});
</script>
</body>
</html>
